services:
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"

  db:
    image: postgres:18
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - rttm_data:/var/lib/postgresql
    env_file:
      - .env


volumes:
  rttm_data: