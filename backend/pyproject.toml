[project]
name = "real-time-team-messenger"
version = "0.1.0"
description = "Real-Time Team Messenger backend"
readme = "README.md"
authors = [
    { name = "Radmir", email = "galiullinradmir17@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
app = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"